<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="350" fill="var(--bg-primary)"/>

  <text x="350" y="30" style="font-size: 18px; font-weight: bold; text-anchor: center; fill: var(--text-primary);">Tech Provider Meta: O diferencial Datafy</text>

  <!-- Left: Sem Tech Provider -->
  <g transform="translate(30, 80)">
    <rect fill="var(--bg-secondary)" stroke="var(--text-secondary)" stroke-width="2" x="0" y="0" width="280" height="240" rx="5"/>

    <text x="140" y="30" style="font-size: 13px; font-weight: bold; text-anchor: center; fill: var(--text-primary);">Direto na Meta</text>
    <text x="140" y="50" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary)">(BSP, Reseller)</text>

    <circle cx="140" cy="80" r="15" fill="#ef4444" opacity="0.2"/>
    <text x="140" y="87" style="font-size: 18px; text-anchor: center; fill: #ef4444;">✗</text>

    <text x="10" y="120" style="font-size: 11px; fill: var(--text-secondary);">✗ Setup 6 semanas</text>
    <text x="10" y="135" style="font-size: 11px; fill: var(--text-secondary);">✗ App Review</text>
    <text x="10" y="150" style="font-size: 11px; fill: var(--text-secondary);">✗ Sem coexistência</text>
    <text x="10" y="165" style="font-size: 11px; fill: var(--text-secondary);">✗ DevOps seu</text>
    <text x="10" y="180" style="font-size: 11px; fill: var(--text-secondary);">✗ Sem integrações nativas</text>
    <text x="10" y="195" style="font-size: 11px; fill: var(--text-secondary);">✓ Custo zero por número</text>

    <text x="140" y="225" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary);">Para: DevOps puro</text>
  </g>

  <!-- Right: Com Tech Provider (Datafy) -->
  <g transform="translate(380, 80)">
    <rect fill="var(--bg-secondary)" stroke="var(--accent-color)" stroke-width="3" x="0" y="0" width="280" height="240" rx="5"/>

    <text x="140" y="30" style="font-size: 13px; font-weight: bold; text-anchor: center; fill: var(--accent-color)">Datafy (Tech Provider)</text>
    <text x="140" y="50" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary)">Certificado Meta</text>

    <circle cx="140" cy="80" r="15" fill="#10b981" opacity="0.2"/>
    <text x="140" y="87" style="font-size: 18px; text-anchor: center; fill: #10b981;">✓</text>

    <text x="10" y="120" style="font-size: 11px; fill: #10b981;">✓ Setup 5 minutos</text>
    <text x="10" y="135" style="font-size: 11px; fill: #10b981;">✓ Nenhuma burocracia</text>
    <text x="10" y="150" style="font-size: 11px; fill: #10b981;">✓ Coexistência nativa</text>
    <text x="10" y="165" style="font-size: 11px; fill: #10b981;">✓ Sem DevOps</text>
    <text x="10" y="180" style="font-size: 11px; fill: #10b981;">✓ n8n/Chatwoot/Make</text>
    <text x="10" y="195" style="font-size: 11px; fill: var(--text-secondary);">⚠ R$ 49,90/mês/número</text>

    <text x="140" y="225" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary);">Para: SaaS e Agências</text>
  </g>

  <!-- Bottom badge -->
  <g transform="translate(200, 330)">
    <rect width="300" height="20" fill="var(--bg-secondary)" rx="3"/>
    <text x="150" y="14" style="font-size: 10px; text-anchor: center; fill: var(--accent-color); font-weight: bold;">🔒 Certificado Meta | Você não é Tech Provider</text>
  </g>
</svg>