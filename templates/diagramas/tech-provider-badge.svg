<svg viewBox="0 0 720 272" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Os três papéis de parceiro na Meta</text>
<rect class="box" x="20" y="46" width="216" height="190" rx="8"/>
<text class="h" x="128" y="76" text-anchor="middle">Solution Partner</text>
<text class="s" x="128" y="93" text-anchor="middle">o que chamam de BSP</text>
<text class="p " x="36" y="118">Tem linha de crédito</text>
<text class="p " x="36" y="140">Fatura o cliente</text>
<text class="p " x="36" y="162">É Meta Business Partner</text>
<text class="p " x="36" y="184">Entra no Accelerator</text>
<rect class="boxok" x="252" y="46" width="216" height="190" rx="8"/>
<text class="h" x="360" y="76" text-anchor="middle">Tech Provider</text>
<text class="s" x="360" y="93" text-anchor="middle">onde a Datafy está</text>
<text class="p " x="268" y="118">Sem linha de crédito</text>
<text class="p " x="268" y="140">Meta fatura o cliente</text>
<text class="p " x="268" y="162">Habilita coexistência</text>
<text class="p " x="268" y="184">Processo self-service</text>
<rect class="box" x="484" y="46" width="216" height="190" rx="8"/>
<text class="h" x="592" y="76" text-anchor="middle">Tech Partner</text>
<text class="s" x="592" y="93" text-anchor="middle">nível acima</text>
<text class="p " x="500" y="118">Tech Provider que virou</text>
<text class="p " x="500" y="140">Meta Business Partner</text>
<text class="p " x="500" y="162">Exige aprovacao extra</text>
<text class="s" x="360" y="258" text-anchor="middle">Coexistência exige que o provedor seja Solution Partner ou Tech Provider.</text>
</svg>