<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Como o webhook entrega a mensagem</text>
<rect class="box" x="30" y="52" width="170" height="70" rx="8"/>
<text class="h" x="115" y="80" text-anchor="middle">Cliente</text>
<text class="s" x="115" y="100" text-anchor="middle">escreve no WhatsApp</text>
<rect class="box" x="275" y="52" width="170" height="70" rx="8"/>
<text class="h" x="360" y="80" text-anchor="middle">Meta</text>
<text class="s" x="360" y="100" text-anchor="middle">faz POST no seu endpoint</text>
<rect class="box" x="520" y="52" width="170" height="70" rx="8"/>
<text class="h" x="605" y="80" text-anchor="middle">Seu servidor</text>
<text class="s" x="605" y="100" text-anchor="middle">responde 200 na hora</text>
<path class="ar" d="M205,87 L268,87"/>
<path class="ar" d="M450,87 L513,87"/>
<rect class="box" x="30" y="146" width="330" height="76" rx="8"/>
<text class="h" x="46" y="170">Se você falhar</text>
<text class="p" x="46" y="192">A Meta reentrega com frequência</text>
<text class="p" x="46" y="210">decrescente por até 7 dias.</text>
<rect class="box" x="380" y="146" width="310" height="76" rx="8"/>
<text class="h" x="396" y="170">Como validar</text>
<text class="p" x="396" y="192">HMAC SHA-256 no header</text>
<text class="p" x="396" y="210">X-Hub-Signature-256.</text>
</svg>