<svg viewBox="0 0 800 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="280" fill="#ffffff"/>

  <text x="400" y="25" style="font-size: 18px; font-weight: bold; text-anchor: center; fill: #1a1a1a;">UAZAPI: Trade-off técnico</text>

  <!-- Left -->
  <g transform="translate(50, 60)">
    <rect fill="#f5f5f5" stroke="#666" stroke-width="2" x="0" y="0" width="300" height="200" rx="5"/>

    <text x="150" y="30" style="font-size: 13px; font-weight: bold; text-anchor: center; fill: #1a1a1a;">UAZAPI</text>
    <text x="150" y="50" style="font-size: 10px; text-anchor: center; fill: #666;">Emulação HTTP</text>

    <text x="10" y="80" style="font-size: 10px; fill: #10b981; font-weight: bold;">✓ Rápido demais</text>
    <text x="10" y="98" style="font-size: 9px; fill: #666;">Literal hoje</text>

    <text x="10" y="120" style="font-size: 10px; fill: #10b981; font-weight: bold;">✓ Sem burocracia</text>
    <text x="10" y="138" style="font-size: 9px; fill: #666;">Começa na hora</text>

    <text x="10" y="160" style="font-size: 10px; fill: #ef4444; font-weight: bold;">✗ Zero contrato</text>
    <text x="10" y="178" style="font-size: 9px; fill: #666;">Ban sem recurso</text>

    <text x="150" y="210" style="font-size: 9px; text-anchor: center; fill: #666;">Para: Protótipo 48h</text>
  </g>

  <!-- Right -->
  <g transform="translate(420, 60)">
    <rect fill="#f5f5f5" stroke="#0ea5e9" stroke-width="3" x="0" y="0" width="300" height="200" rx="5"/>

    <text x="150" y="30" style="font-size: 13px; font-weight: bold; text-anchor: center; fill: #0ea5e9;">API Oficial</text>
    <text x="150" y="50" style="font-size: 10px; text-anchor: center; fill: #666;">Com Datafy</text>

    <text x="10" y="80" style="font-size: 10px; fill: #10b981; font-weight: bold;">✓ Rápido igual</text>
    <text x="10" y="98" style="font-size: 9px; fill: #666;">5 minutos setup</text>

    <text x="10" y="120" style="font-size: 10px; fill: #10b981; font-weight: bold;">✓ Com contrato</text>
    <text x="10" y="138" style="font-size: 9px; fill: #666;">Suporte, recurso</text>

    <text x="10" y="160" style="font-size: 10px; fill: #666; font-weight: bold;">⚠ Taxa fixa</text>
    <text x="10" y="178" style="font-size: 9px; fill: #666;">R$ 49,90/mês</text>

    <text x="150" y="210" style="font-size: 9px; text-anchor: center; fill: #666;">Para: Produção 6+ meses</text>
  </g>
</svg>