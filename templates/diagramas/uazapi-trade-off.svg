<svg viewBox="0 0 720 268" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">UAZAPI e API oficial: o que muda</text>
<rect class="box" x="20" y="46" width="330" height="186" rx="8"/>
<text class="h" x="185" y="76" text-anchor="middle">UAZAPI</text>
<text class="s" x="185" y="93" text-anchor="middle">emulação do WhatsApp Web</text>
<text class="p ok" x="36" y="118">✓ Começa sem Business Manager</text>
<text class="p ok" x="36" y="140">✓ Conecta por QR code</text>
<text class="p no" x="36" y="162">✗ Sem contrato com a Meta</text>
<text class="p no" x="36" y="184">✗ Sem canal de recurso</text>
<rect class="boxok" x="370" y="46" width="330" height="186" rx="8"/>
<text class="h" x="535" y="76" text-anchor="middle">API oficial</text>
<text class="s" x="535" y="93" text-anchor="middle">endpoint da Meta</text>
<text class="p ok" x="386" y="118">✓ Contrato e recurso</text>
<text class="p ok" x="386" y="140">✓ Endpoint versionado</text>
<text class="p ok" x="386" y="162">✓ Coexistência com o app</text>
<text class="p " x="386" y="184">• Exige Business Manager</text>
<text class="s" x="360" y="254" text-anchor="middle">Protótipo de fim de semana ou produção com clientes: a resposta muda com o prazo.</text>
</svg>