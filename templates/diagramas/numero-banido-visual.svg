<svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
  </style>
<text class="t" x="360" y="26" text-anchor="middle">"Você não é bloqueado do nada"</text>
<line class="ln" x1="120" y1="80" x2="600" y2="80"/>
<circle cx="120" cy="80" r="9" fill="var(--accent)"/>
<text class="h" x="120" y="112" text-anchor="middle">Qualidade alta</text>
<text class="s" x="120" y="130" text-anchor="middle">no Gerenciador do WhatsApp</text>
<circle cx="360" cy="80" r="9" fill="var(--warn-line)"/>
<text class="h" x="360" y="112" text-anchor="middle">Média ou baixa</text>
<text class="s" x="360" y="130" text-anchor="middle">o alerta para melhorar algo</text>
<circle cx="600" cy="80" r="9" fill="var(--danger)"/>
<text class="h" x="600" y="112" text-anchor="middle">Bloqueio</text>
<text class="s" x="600" y="130" text-anchor="middle">quem não olhou, descobre aqui</text>
<rect class="box" x="20" y="152" width="680" height="92" rx="8"/>
<text class="h" x="36" y="176">O que os clientes estavam fazendo quando caíram (vídeo do canal DATA7)</text>
<text class="p" x="36" y="200">1. Iniciar conversa sem template</text>
<text class="p" x="376" y="200">2. Template certo, e ninguém responde</text>
<text class="p" x="36" y="220">3. Número novo começando a disparar</text>
<text class="p" x="376" y="220">4. Marketing disfarçado de utilidade</text>
<text class="p" x="36" y="240">5. Nicho proibido pela Meta</text>
</svg>
