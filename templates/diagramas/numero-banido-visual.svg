<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .phone-bg { fill: var(--bg-secondary); stroke: var(--text-primary); stroke-width: 3; }
      .screen { fill: var(--bg-primary); }
      .error-icon { fill: #ef4444; }
      .error-text { font-size: 18px; font-weight: bold; fill: #ef4444; text-anchor: middle; }
      .error-message { font-size: 14px; fill: var(--text-primary); text-anchor: middle; }
      .label-text { font-size: 12px; fill: var(--text-secondary); text-anchor: middle; }
      .warning-box { fill: var(--bg-secondary); stroke: #f59e0b; stroke-width: 2; }
      .warning-text { font-size: 12px; fill: #f59e0b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="var(--bg-primary)"/>

  <!-- Title -->
  <text x="300" y="30" style="font-size: 20px; font-weight: bold; text-anchor: center; fill: var(--text-primary);">Número banido: sem aviso, sem recurso</text>

  <!-- Left: Phone with error -->
  <g transform="translate(150, 100)">
    <!-- Phone frame -->
    <rect class="phone-bg" x="0" y="0" width="160" height="200" rx="15"/>

    <!-- Screen -->
    <rect class="screen" x="8" y="15" width="144" height="170"/>

    <!-- Status bar -->
    <rect fill="var(--accent-color)" x="8" y="15" width="144" height="20"/>
    <text x="80" y="32" style="font-size: 10px; fill: white; text-anchor: middle;">WhatsApp</text>

    <!-- Error icon -->
    <circle class="error-icon" cx="80" cy="70" r="20"/>
    <text x="80" y="78" style="font-size: 28px; text-anchor: middle; fill: white;">!</text>

    <!-- Error message -->
    <text x="80" y="115" class="error-text">Erro</text>
    <text x="80" y="145" class="error-message">Esta conta não pode</text>
    <text x="80" y="162" class="error-message">mais usar WhatsApp</text>
  </g>

  <!-- Right: Timeline/Impact -->
  <g transform="translate(360, 80)">
    <!-- Timeline -->
    <line x1="10" y1="20" x2="10" y2="220" stroke="var(--accent-color)" stroke-width="2"/>

    <!-- Point 1: Works fine -->
    <circle cx="10" cy="20" r="6" fill="var(--accent-color)"/>
    <rect class="warning-box" x="25" y="8" width="120" height="40" rx="4"/>
    <text x="85" y="20" class="warning-text" style="font-weight: bold;">✓ Funcionando</text>
    <text x="85" y="35" class="label-text">Você não sabe</text>

    <!-- Point 2: Quality warning -->
    <circle cx="10" cy="85" r="6" fill="#f59e0b"/>
    <rect class="warning-box" x="25" y="73" width="120" height="40" rx="4"/>
    <text x="85" y="85" class="warning-text" style="font-weight: bold;">⚠ Qualidade cai</text>
    <text x="85" y="100" class="label-text">Sinal de alerta</text>

    <!-- Point 3: Ban -->
    <circle cx="10" cy="150" r="6" fill="#ef4444"/>
    <rect x="25" y="138" width="120" height="40" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    <text x="85" y="150" class="error-text" style="font-weight: bold;">✗ BAN</text>
    <text x="85" y="165" class="label-text">Sem aviso prévio</text>

    <!-- Point 4: Recovery -->
    <circle cx="10" cy="215" r="6" fill="#10b981"/>
    <rect class="warning-box" x="25" y="203" width="120" height="40" rx="4" fill="var(--bg-secondary)" stroke="#10b981" stroke-width="2"/>
    <text x="85" y="215" style="font-size: 12px; font-weight: bold; fill: #10b981; text-anchor: middle;">📧 Apelo</text>
    <text x="85" y="230" class="label-text">10-30 dias</text>
  </g>

  <!-- Bottom: Key facts -->
  <g transform="translate(0, 310)">
    <rect fill="var(--bg-secondary)" x="20" y="0" width="560" height="70" rx="5"/>
    <text x="300" y="20" style="font-size: 13px; font-weight: bold; text-anchor: center; fill: var(--text-primary);">5 condutas que causam ban (mesmo com API oficial):</text>
    <text x="300" y="40" style="font-size: 11px; text-anchor: center; fill: var(--text-secondary);">1) Prospecção sem template  2) Alto rejeitamento  3) Volume muito alto muito rápido</text>
    <text x="300" y="55" style="font-size: 11px; text-anchor: center; fill: var(--text-secondary);">4) Conteúdo proibido  5) Comportamento suspeito</text>
  </g>
</svg>