<svg viewBox="0 0 720 256" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Ninguém é bloqueado do nada</text>
<line class="ln" x1="90" y1="80" x2="630" y2="80"/>
<circle cx="90" cy="80" r="9" fill="var(--accent)"/>
<text class="h" x="90" y="112" text-anchor="middle">Funcionando</text>
<text class="s" x="90" y="130" text-anchor="middle">qualidade alta</text>
<circle cx="270" cy="80" r="9" fill="var(--warn-line)"/>
<text class="h" x="270" y="112" text-anchor="middle">Qualidade cai</text>
<text class="s" x="270" y="130" text-anchor="middle">alta vira média</text>
<circle cx="450" cy="80" r="9" fill="var(--danger)"/>
<text class="h" x="450" y="112" text-anchor="middle">Bloqueio</text>
<text class="s" x="450" y="130" text-anchor="middle">sem aviso novo</text>
<circle cx="630" cy="80" r="9" fill="var(--muted)"/>
<text class="h" x="630" y="112" text-anchor="middle">Recurso</text>
<text class="s" x="630" y="130" text-anchor="middle">com prova de conformidade</text>
<rect class="box" x="20" y="152" width="680" height="92" rx="8"/>
<text class="h" x="36" y="176">As cinco condutas que derrubam número, mesmo com API oficial</text>
<text class="p" x="36" y="200">1. Prospecção sem template</text>
<text class="p" x="376" y="200">2. Engajamento baixo, mesmo com template</text>
<text class="p" x="36" y="220">3. Número novo disparando em volume</text>
<text class="p" x="376" y="220">4. Categoria de template falsificada</text>
<text class="p" x="36" y="240">5. Nicho proibido pela Meta</text>
</svg>