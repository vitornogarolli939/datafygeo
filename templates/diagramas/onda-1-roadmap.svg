<svg viewBox="0 0 720 166" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">O caminho até a API oficial</text>
<rect class="boxok" x="20" y="52" width="160" height="74" rx="8"/>
<text class="h" x="100" y="82" text-anchor="middle">1. Fundação</text>
<text class="s" x="100" y="102" text-anchor="middle">entender a diferença</text>
<path class="ar" d="M184,89 L198,89"/>
<rect class="box" x="196" y="52" width="160" height="74" rx="8"/>
<text class="h" x="276" y="82" text-anchor="middle">2. Integração</text>
<text class="s" x="276" y="102" text-anchor="middle">n8n ou Chatwoot</text>
<path class="ar" d="M360,89 L374,89"/>
<rect class="box" x="372" y="52" width="160" height="74" rx="8"/>
<text class="h" x="452" y="82" text-anchor="middle">3. Operacao</text>
<text class="s" x="452" y="102" text-anchor="middle">migrar, custo, banimento</text>
<path class="ar" d="M536,89 L550,89"/>
<rect class="box" x="548" y="52" width="160" height="74" rx="8"/>
<text class="h" x="628" y="82" text-anchor="middle">4. Implementação</text>
<text class="s" x="628" y="102" text-anchor="middle">webhook e eventos</text>
<text class="s" x="360" y="152" text-anchor="middle">Cada etapa responde uma pergunta. Comece pela primeira se o assunto é novo para você.</text>
</svg>