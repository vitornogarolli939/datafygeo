<svg viewBox="0 0 340 300" role="img" aria-labelledby="heroT heroD" style="width:100%;height:auto;max-width:340px;margin-inline:auto;display:block">
        <title id="heroT">Tela de celular com a mensagem de banimento do WhatsApp</title>
        <desc id="heroD">Ilustração de um celular exibindo o aviso de que a conta não pode mais usar o WhatsApp, que é o que acontece quando a Meta detecta automação por aplicativo não autorizado.</desc>
        <defs>
          <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--surface)"/>
            <stop offset="1" stop-color="var(--code-bg)"/>
          </linearGradient>
        </defs>
        <rect x="86" y="16" width="168" height="268" rx="26" fill="var(--fg)" opacity=".92"/>
        <rect x="92" y="22" width="156" height="256" rx="21" fill="url(#scr)"/>
        <rect x="150" y="30" width="40" height="6" rx="3" fill="var(--fg)" opacity=".25"/>
        <circle cx="170" cy="88" r="27" fill="var(--danger-soft)"/>
        <path d="M170 74 v17" stroke="var(--danger)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="170" cy="100" r="2.6" fill="var(--danger)"/>
        <text x="170" y="140" text-anchor="middle"
              style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg)">Esta conta não pode</text>
        <text x="170" y="156" text-anchor="middle"
              style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg)">mais usar o WhatsApp</text>
        <rect x="110" y="174" width="120" height="5" rx="2.5" fill="var(--muted)" opacity=".33"/>
        <rect x="118" y="186" width="104" height="5" rx="2.5" fill="var(--muted)" opacity=".33"/>
        <rect x="126" y="198" width="88" height="5" rx="2.5" fill="var(--muted)" opacity=".33"/>
        <rect x="110" y="224" width="120" height="30" rx="8" fill="var(--danger-soft)"/>
        <text x="170" y="243" text-anchor="middle"
              style="font:600 10.5px system-ui,-apple-system,sans-serif;fill:var(--danger)">Sem aviso. Sem recurso.</text>
        <g opacity=".55">
          <rect x="12" y="96" width="58" height="7" rx="3.5" fill="var(--muted)"/>
          <rect x="12" y="112" width="42" height="7" rx="3.5" fill="var(--muted)"/>
          <rect x="270" y="150" width="58" height="7" rx="3.5" fill="var(--muted)"/>
          <rect x="286" y="166" width="42" height="7" rx="3.5" fill="var(--muted)"/>
        </g>
      </svg>