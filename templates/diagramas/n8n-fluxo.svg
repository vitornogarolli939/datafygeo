<svg viewBox="0 0 720 222" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Um fluxo de atendimento no n8n</text>
<rect class="box" x="20" y="52" width="152" height="66" rx="8"/>
<text class="h" x="96" y="80" text-anchor="middle">Webhook</text>
<text class="s" x="96" y="98" text-anchor="middle">mensagem chega</text>
<rect class="box" x="196" y="52" width="152" height="66" rx="8"/>
<text class="h" x="272" y="80" text-anchor="middle">Condicional</text>
<text class="s" x="272" y="98" text-anchor="middle">regra de negocio</text>
<rect class="box" x="372" y="52" width="152" height="66" rx="8"/>
<text class="h" x="448" y="80" text-anchor="middle">HTTP Request</text>
<text class="s" x="448" y="98" text-anchor="middle">responde pela API</text>
<rect class="box" x="548" y="52" width="152" height="66" rx="8"/>
<text class="h" x="624" y="80" text-anchor="middle">Banco</text>
<text class="s" x="624" y="98" text-anchor="middle">registra a conversa</text>
<path class="ar" d="M172,85 L190,85"/>
<path class="ar" d="M348,85 L366,85"/>
<path class="ar" d="M524,85 L542,85"/>
<rect class="box" x="20" y="142" width="680" height="64" rx="8"/>
<text class="h" x="36" y="166">Limites que o fluxo precisa respeitar</text>
<text class="p" x="36" y="190">• 80 msg/s por número</text>
<text class="p" x="266" y="190">• 1 msg a cada 6 s por contato</text>
<text class="p" x="516" y="190">• responder 200 na hora</text>
</svg>