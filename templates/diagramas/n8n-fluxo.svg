<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .node { fill: #f5f5f5; stroke: #0ea5e9; stroke-width: 2; }
      .node-text { font-size: 12px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
      .arrow { stroke: #0ea5e9; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .label { font-size: 10px; fill: #666; }
      .data-flow { font-size: 10px; fill: #0ea5e9; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="30" style="font-size: 18px; font-weight: bold; text-anchor: center; fill: #1a1a1a;">Automação no n8n: WhatsApp + qualquer ferramenta</text>

  <!-- Node 1: Webhook (entrada) -->
  <g transform="translate(50, 80)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">Webhook</text>
    <text x="50" y="42" class="label">Mensagem chega</text>
  </g>

  <!-- Arrow 1 -->
  <path class="arrow" d="M 150 110 L 200 110"/>
  <text x="175" y="100" class="data-flow">JSON</text>

  <!-- Node 2: Condicional -->
  <g transform="translate(200, 80)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">Se...então</text>
    <text x="50" y="42" class="label">Regra de negócio</text>
  </g>

  <!-- Arrow 2a -->
  <path class="arrow" d="M 300 110 L 350 60"/>
  <text x="315" y="85" class="data-flow">Sim</text>

  <!-- Node 3a: Typeform -->
  <g transform="translate(350, 30)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">Typeform</text>
    <text x="50" y="42" class="label">Enviar formulário</text>
  </g>

  <!-- Arrow 2b -->
  <path class="arrow" d="M 300 110 L 350 160"/>
  <text x="315" y="145" class="data-flow">Não</text>

  <!-- Node 3b: Responder -->
  <g transform="translate(350, 130)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">HTTP Request</text>
    <text x="50" y="42" class="label">WhatsApp API</text>
  </g>

  <!-- Arrows 3a e 3b convergem -->
  <path class="arrow" d="M 450 60 L 500 110"/>
  <path class="arrow" d="M 450 160 L 500 110"/>

  <!-- Node 4: Database -->
  <g transform="translate(500, 80)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">Database</text>
    <text x="50" y="42" class="label">Salvar resposta</text>
  </g>

  <!-- Arrow 4 -->
  <path class="arrow" d="M 600 110 L 650 110"/>
  <text x="625" y="100" class="data-flow">Query</text>

  <!-- Node 5: CRM -->
  <g transform="translate(650, 80)">
    <rect class="node" x="0" y="0" width="100" height="60" rx="5"/>
    <text x="50" y="25" class="node-text">CRM</text>
    <text x="50" y="42" class="label">Atualizar contato</text>
  </g>

  <!-- Bottom legend -->
  <g transform="translate(50, 170)">
    <text x="0" y="0" style="font-size: 12px; font-weight: bold; fill: #1a1a1a;">Exemplo real:</text>
    <text x="0" y="20" style="font-size: 11px; fill: #666;">1. Cliente manda mensagem no WhatsApp</text>
    <text x="0" y="35" style="font-size: 11px; fill: #666;">2. n8n recebe, lê conteúdo (webhook)</text>
    <text x="0" y="50" style="font-size: 11px; fill: #666;">3. Se pergunta de venda → envia Typeform | Se resposta já conhecida → WhatsApp API</text>
    <text x="0" y="65" style="font-size: 11px; fill: #666;">4. Salva histórico em database e atualiza CRM</text>
    <text x="0" y="80" style="font-size: 11px; fill: #666;">5. Tudo sem escrever código (visual workflow)</text>
  </g>
</svg>