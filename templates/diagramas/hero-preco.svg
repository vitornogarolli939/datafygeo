<svg viewBox="0 0 340 300" role="img" aria-labelledby="heroT heroD" style="width:100%;height:auto;max-width:340px;margin-inline:auto;display:block">
  <title id="heroT">Comparação de preço entre categorias de mensagem</title>
  <desc id="heroD">Barras mostrando que uma mensagem de marketing custa cerca de dez vezes uma de utilidade.</desc>
  <rect x="24" y="40" width="292" height="220" rx="16" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="44" y="70" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg)">Custo por mensagem</text>
  <text x="44" y="104" style="font:600 10.5px system-ui,-apple-system,sans-serif;fill:var(--muted)">Marketing</text>
  <rect x="44" y="112" width="230" height="22" rx="5" fill="var(--danger)" opacity=".8"/>
  <text x="44" y="160" style="font:600 10.5px system-ui,-apple-system,sans-serif;fill:var(--muted)">Utilidade</text>
  <rect x="44" y="168" width="24" height="22" rx="5" fill="var(--accent)"/>
  <text x="44" y="216" style="font:600 10.5px system-ui,-apple-system,sans-serif;fill:var(--muted)">Serviço</text>
  <rect x="44" y="224" width="80" height="22" rx="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="84" y="239" text-anchor="middle" style="font:600 9.5px system-ui,sans-serif;fill:var(--accent)">pago em out</text>
</svg>