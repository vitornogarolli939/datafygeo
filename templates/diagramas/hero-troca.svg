  <text x="280" y="142" text-anchor="middle" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg);fill:var(--accent)">depois</text>
  <path d="M112 136 H150" stroke="var(--muted)" stroke-width="2" fill="none" opacity=".5"/>
