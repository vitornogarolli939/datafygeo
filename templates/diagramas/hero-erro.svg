<svg viewBox="0 0 340 300" role="img" aria-labelledby="heroT heroD" style="width:100%;height:auto;max-width:340px;margin-inline:auto;display:block">
  <title id="heroT">Registro de status com uma falha destacada</title>
  <desc id="heroD">Ilustração de uma lista de status de mensagens em que uma linha aparece marcada como falha.</desc>
  <rect x="30" y="52" width="280" height="196" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="30" y="52" width="280" height="32" rx="14" fill="var(--code-bg)"/>
  <rect x="30" y="74" width="280" height="10" fill="var(--code-bg)"/>
  <text x="48" y="74" style="font:700 10px ui-monospace,monospace;fill:var(--muted)">statuses</text>
  <g opacity=".55">
    <rect x="48" y="100" width="150" height="6" rx="3" fill="var(--muted)"/>
    <text x="294" y="107" text-anchor="end" style="font:700 9px ui-monospace,monospace;fill:var(--accent)">delivered</text>
  </g>
  <g opacity=".55">
    <rect x="48" y="126" width="120" height="6" rx="3" fill="var(--muted)"/>
    <text x="294" y="133" text-anchor="end" style="font:700 9px ui-monospace,monospace;fill:var(--accent)">read</text>
  </g>
  <rect x="40" y="146" width="260" height="40" rx="8" fill="var(--danger-soft)" stroke="var(--danger)" stroke-width="1.5"/>
  <text x="52" y="162" style="font:700 10px ui-monospace,monospace;fill:var(--danger)">failed</text>
  <text x="52" y="178" style="font:600 10px ui-monospace,monospace;fill:var(--danger)">o motivo vem aqui dentro</text>
  <g opacity=".35">
    <rect x="48" y="202" width="140" height="6" rx="3" fill="var(--muted)"/>
    <rect x="48" y="220" width="100" height="6" rx="3" fill="var(--muted)"/>
  </g>
</svg>
