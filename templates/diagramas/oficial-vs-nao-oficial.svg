<svg viewBox="0 0 720 292" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
  </style>
<text class="t" x="360" y="26" text-anchor="middle">O que muda na prática, segundo o canal DATA7</text>
<rect class="boxok" x="20" y="46" width="320" height="210" rx="8"/>
<text class="h" x="180" y="76" text-anchor="middle">API oficial</text>
<text class="s" x="180" y="93" text-anchor="middle">conexão pela Meta</text>
<text class="p" x="36" y="120">• Inicia conversa só com template aprovado</text>
<text class="p" x="36" y="144">• Cobra por mensagem enviada pela API</text>
<text class="p" x="36" y="168">• Mostra a qualidade do número antes</text>
<text class="p" x="36" y="192">• Não é blindagem contra bloqueio</text>
<text class="p" x="36" y="216">• Dá respaldo para reclamar de bloqueio</text>
<rect class="box" x="380" y="46" width="320" height="210" rx="8"/>
<text class="h" x="540" y="76" text-anchor="middle">API não oficial</text>
<text class="s" x="540" y="93" text-anchor="middle">conexão por QR code do WhatsApp Web</text>
<text class="p" x="396" y="120">• Manda mensagem livre para qualquer um</text>
<text class="p" x="396" y="144">• Não cobra por mensagem da Meta</text>
<text class="p" x="396" y="168">• A Meta proíbe iniciar sem template</text>
<text class="p" x="396" y="192">• Quem usa relata mais bloqueio</text>
<text class="p" x="396" y="216">• Bloqueado, "não adianta muito reclamar"</text>
<text class="s" x="360" y="278" text-anchor="middle">O próprio CTO da Datafy usa as duas, e diz isso em vídeo.</text>
</svg>
