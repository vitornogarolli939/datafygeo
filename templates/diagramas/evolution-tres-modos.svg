<svg viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="280" fill="var(--bg-primary)"/>

  <text x="450" y="25" style="font-size: 18px; font-weight: bold; text-anchor: center; fill: var(--text-primary);">Evolution API: 3 modos, riscos diferentes</text>

  <!-- Modo 1: Baileys -->
  <g transform="translate(40, 60)">
    <rect fill="var(--bg-secondary)" stroke="#ef4444" stroke-width="2" x="0" y="0" width="240" height="200" rx="5"/>
    <text x="120" y="28" style="font-size: 12px; font-weight: bold; text-anchor: center; fill: #ef4444;">1. Baileys</text>
    <text x="120" y="48" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary);">(Emulação)</text>

    <circle cx="120" cy="85" r="12" fill="#ef4444" opacity="0.2"/>
    <text x="120" y="92" style="font-size: 14px; text-anchor: center; fill: #ef4444;">✗</text>

    <text x="10" y="120" style="font-size: 10px; fill: var(--text-secondary); font-weight: bold;">Sua responsabilidade:</text>
    <text x="10" y="135" style="font-size: 9px; fill: var(--text-secondary);">• Rodar servidor</text>
    <text x="10" y="148" style="font-size: 9px; fill: var(--text-secondary);">• Manter código</text>
    <text x="10" y="161" style="font-size: 9px; fill: var(--text-secondary);">• Atualizar quando quebra</text>
    <text x="10" y="174" style="font-size: 9px; fill: #ef4444; font-weight: bold;">• Risco de ban</text>

    <text x="120" y="200" style="font-size: 9px; text-anchor: center; fill: #ef4444; font-weight: bold;">⚠ Pior opção</text>
  </g>

  <!-- Modo 2: Cloud API -->
  <g transform="translate(330, 60)">
    <rect fill="var(--bg-secondary)" stroke="#f59e0b" stroke-width="2" x="0" y="0" width="240" height="200" rx="5"/>
    <text x="120" y="28" style="font-size: 12px; font-weight: bold; text-anchor: center; fill: #f59e0b;">2. Cloud API</text>
    <text x="120" y="48" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary);">(Proxy)</text>

    <circle cx="120" cy="85" r="12" fill="#f59e0b" opacity="0.2"/>
    <text x="120" y="92" style="font-size: 14px; text-anchor: center; fill: #f59e0b;">⚠</text>

    <text x="10" y="120" style="font-size: 10px; fill: var(--text-secondary); font-weight: bold;">Sua responsabilidade:</text>
    <text x="10" y="135" style="font-size: 9px; fill: var(--text-secondary);">• Rodar servidor</text>
    <text x="10" y="148" style="font-size: 9px; fill: var(--text-secondary);">• Manter token seguro</text>
    <text x="10" y="161" style="font-size: 9px; fill: var(--text-secondary);">• Se cair, você cai</text>
    <text x="10" y="174" style="font-size: 9px; fill: var(--text-secondary);">• DevOps necessário</text>

    <text x="120" y="200" style="font-size: 9px; text-anchor: center; fill: #f59e0b; font-weight: bold;">⚠ Funciona, mas...</text>
  </g>

  <!-- Modo 3: Datafy (Cloud API oficial) -->
  <g transform="translate(620, 60)">
    <rect fill="var(--bg-secondary)" stroke="#10b981" stroke-width="3" x="0" y="0" width="240" height="200" rx="5"/>
    <text x="120" y="28" style="font-size: 12px; font-weight: bold; text-anchor: center; fill: #10b981;">3. Datafy</text>
    <text x="120" y="48" style="font-size: 10px; text-anchor: center; fill: var(--text-secondary);">(SaaS Cloud API)</text>

    <circle cx="120" cy="85" r="12" fill="#10b981" opacity="0.2"/>
    <text x="120" y="92" style="font-size: 14px; text-anchor: center; fill: #10b981;">✓</text>

    <text x="10" y="120" style="font-size: 10px; fill: #10b981; font-weight: bold;">Nós cuidamos:</text>
    <text x="10" y="135" style="font-size: 9px; fill: #10b981;">• Servidor rodando</text>
    <text x="10" y="148" style="font-size: 9px; fill: #10b981;">• Token seguro</text>
    <text x="10" y="161" style="font-size: 9px; fill: #10b981;">• Uptime 99,9%</text>
    <text x="10" y="174" style="font-size: 9px; fill: #10b981;">• Nenhum DevOps</text>

    <text x="120" y="200" style="font-size: 9px; text-anchor: center; fill: #10b981; font-weight: bold;">✓ Melhor escolha</text>
  </g>
</svg>