<svg viewBox="0 0 720 262" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Coexistência: o mesmo número nos dois lugares</text>
<rect class="box" x="60" y="52" width="200" height="72" rx="8"/>
<text class="h" x="160" y="80" text-anchor="middle">Aplicativo no celular</text>
<text class="s" x="160" y="100" text-anchor="middle">atendimento humano</text>
<rect class="box" x="460" y="52" width="200" height="72" rx="8"/>
<text class="h" x="560" y="80" text-anchor="middle">Cloud API</text>
<text class="s" x="560" y="100" text-anchor="middle">automacao e disparo</text>
<rect class="boxok" x="290" y="60" width="140" height="56" rx="8"/>
<text class="h ok" x="360" y="84" text-anchor="middle">1 número</text>
<text class="s" x="360" y="102" text-anchor="middle">mesmo histórico</text>
<path class="ar" d="M265,88 L283,88"/>
<path class="ar" d="M437,88 L455,88"/>
<rect class="box" x="30" y="146" width="660" height="100" rx="8"/>
<text class="h" x="46" y="170">Limites reais da sincronização de histórico</text>
<text class="p" x="46" y="196">• 180 dias de conversa</text>
<text class="p" x="266" y="196">• grupos não sincronizam</text>
<text class="p" x="486" y="196">• mídia só dos últimos 14 dias</text>
<text class="p" x="46" y="218">• 24 h para disparar a sync</text>
<text class="p" x="266" y="218">• 20 msg/s de throughput</text>
<text class="p" x="486" y="218">• uma vez só, no onboarding</text>
</svg>