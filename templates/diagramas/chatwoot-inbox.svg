<svg viewBox="0 0 720 254" xmlns="http://www.w3.org/2000/svg" class="d">
  <style>
    .d text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:15px;font-weight:600;fill:var(--fg)}
    .h{font-size:13px;font-weight:600;fill:var(--fg)}
    .p{font-size:12px;fill:var(--muted)}
    .s{font-size:11px;fill:var(--muted)}
    .ok{fill:var(--accent)}
    .no{fill:var(--danger)}
    .box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
    .boxok{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
    .boxno{fill:var(--danger-soft);stroke:var(--danger);stroke-width:1.5}
    .ln{stroke:var(--line);stroke-width:1.5;fill:none}
    .ar{stroke:var(--accent);stroke-width:1.5;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
    <path d="M0,0 L7,2.5 L0,5 z" fill="var(--accent)"/></marker></defs>
<text class="t" x="360" y="26" text-anchor="middle">Chatwoot: uma fila no lugar de várias caixas</text>
<rect class="box" x="20" y="46" width="330" height="172" rx="8"/>
<text class="h" x="185" y="76" text-anchor="middle">Sem inbox compartilhado</text>
<text class="p " x="36" y="104">Cada um responde do seu aparelho</text>
<text class="p " x="36" y="126">Ninguém sabe quem já respondeu</text>
<text class="p " x="36" y="148">Histórico espalhado</text>
<text class="p " x="36" y="170">Cliente recebe resposta repetida</text>
<rect class="boxok" x="370" y="46" width="330" height="172" rx="8"/>
<text class="h" x="535" y="76" text-anchor="middle">Com inbox compartilhado</text>
<text class="p ok" x="386" y="104">✓ Uma fila para a equipe</text>
<text class="p ok" x="386" y="126">✓ Da para ver quem assumiu</text>
<text class="p ok" x="386" y="148">✓ Tags, status e atribuição</text>
<text class="p ok" x="386" y="170">✓ Histórico em um lugar só</text>
<text class="s" x="360" y="240" text-anchor="middle">Com coexistência, o que o gerente responde pelo celular aparece na mesma fila.</text>
</svg>