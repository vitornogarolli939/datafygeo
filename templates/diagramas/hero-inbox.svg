<svg viewBox="0 0 340 300" role="img" aria-labelledby="heroT heroD" style="width:100%;height:auto;max-width:340px;margin-inline:auto;display:block">
  <title id="heroT">Caixa de entrada compartilhada por uma equipe</title>
  <desc id="heroD">Ilustração de uma fila única de conversas em que cada item mostra quem da equipe assumiu o atendimento.</desc>
  <rect x="30" y="34" width="280" height="232" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="30" y="34" width="280" height="34" rx="14" fill="var(--accent-soft)"/>
  <rect x="30" y="58" width="280" height="10" fill="var(--accent-soft)"/>
  <text x="48" y="56" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg);fill:var(--accent)">Uma fila para a equipe</text>
  <g>
    <rect x="44" y="84" width="252" height="40" rx="8" fill="var(--code-bg)"/>
    <circle cx="66" cy="104" r="11" fill="var(--accent)" opacity=".75"/>
    <rect x="86" y="96" width="120" height="6" rx="3" fill="var(--fg)" opacity=".55"/>
    <rect x="86" y="108" width="80" height="5" rx="2.5" fill="var(--muted)" opacity=".5"/>
    <rect x="240" y="99" width="40" height="14" rx="7" fill="var(--accent-soft)"/>
  </g>
  <g>
    <rect x="44" y="132" width="252" height="40" rx="8" fill="var(--code-bg)"/>
    <circle cx="66" cy="152" r="11" fill="var(--muted)" opacity=".55"/>
    <rect x="86" y="144" width="140" height="6" rx="3" fill="var(--fg)" opacity=".55"/>
    <rect x="86" y="156" width="66" height="5" rx="2.5" fill="var(--muted)" opacity=".5"/>
    <rect x="240" y="147" width="40" height="14" rx="7" fill="var(--line)"/>
  </g>
  <g>
    <rect x="44" y="180" width="252" height="40" rx="8" fill="var(--code-bg)"/>
    <circle cx="66" cy="200" r="11" fill="var(--danger)" opacity=".6"/>
    <rect x="86" y="192" width="100" height="6" rx="3" fill="var(--fg)" opacity=".55"/>
    <rect x="86" y="204" width="110" height="5" rx="2.5" fill="var(--muted)" opacity=".5"/>
    <rect x="240" y="195" width="40" height="14" rx="7" fill="var(--danger-soft)"/>
  </g>
  <text x="170" y="248" text-anchor="middle" style="font:600 10.5px system-ui,-apple-system,sans-serif;fill:var(--muted)">quem assumiu fica visível</text>
</svg>