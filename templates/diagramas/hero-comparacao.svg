<svg viewBox="0 0 340 300" role="img" aria-labelledby="heroT heroD" style="width:100%;height:auto;max-width:340px;margin-inline:auto;display:block">
  <title id="heroT">As três regras da API oficial do WhatsApp</title>
  <desc id="heroD">Template aprovado para iniciar conversa, janela de 24 horas para responder livremente e qualidade do número em alta, média ou baixa.</desc>
  <rect x="40" y="52" width="260" height="56" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="72" cy="80" r="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="72" y="84" text-anchor="middle" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--accent)">1</text>
  <text x="98" y="76" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg)">template aprovado</text>
  <text x="98" y="93" style="font:600 9.5px system-ui,sans-serif;fill:var(--muted)">para iniciar a conversa</text>
  <rect x="40" y="122" width="260" height="56" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="72" cy="150" r="14" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="72" y="154" text-anchor="middle" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--accent)">2</text>
  <text x="98" y="146" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--accent)">janela de 24 horas</text>
  <text x="98" y="163" style="font:600 9.5px system-ui,sans-serif;fill:var(--muted)">resposta livre ao cliente</text>
  <rect x="40" y="192" width="260" height="56" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
  <circle cx="72" cy="220" r="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="72" y="224" text-anchor="middle" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--accent)">3</text>
  <text x="98" y="216" style="font:700 12px system-ui,-apple-system,sans-serif;fill:var(--fg)">qualidade do número</text>
  <text x="98" y="233" style="font:600 9.5px system-ui,sans-serif;fill:var(--muted)">alta, média ou baixa</text>
  <circle cx="254" cy="220" r="5" fill="var(--accent)"/>
  <circle cx="268" cy="220" r="5" fill="var(--warn-line)"/>
  <circle cx="282" cy="220" r="5" fill="var(--danger)"/>
</svg>
